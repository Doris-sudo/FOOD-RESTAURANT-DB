## render.yaml — Render Blueprint
## Defines the PostgreSQL database, Express backend, and Next.js frontend
## as a single deployable unit.
##
## How to use:
##   1. Push this repo to GitHub
##   2. Go to https://dashboard.render.com → New → Blueprint
##   3. Connect your GitHub repo — Render reads this file automatically

databases:
  - name: restaurant-db
    databaseName: restaurant_db
    user: restaurant_user
    plan: free          # free tier: 1 GB, 256 MB RAM — enough for this project

services:
  ## ── Express Backend ────────────────────────────────────────
  - type: web
    name: maison-laurel-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --production=false
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns this automatically; keep in sync
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false           # You'll set this in the Render dashboard after the frontend URL is known
      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value automatically

  ## ── Next.js Frontend ───────────────────────────────────────
  - type: web
    name: maison-laurel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false           # Set to your backend URL after the API service is live
                              # e.g. https://maison-laurel-api.onrender.com/api
